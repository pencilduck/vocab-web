<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背单词</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='8' width='52' height='48' rx='10' fill='%232563EB'/%3E%3Ctext x='32' y='44' font-size='28' font-family='Georgia,serif' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6eedb;
    --card:#fffdf5;
    --ink:#3a3427;
    --sub:#8a7f66;
    --line:#e5dcc4;
    --accent:#2563eb;
    --accent-deep:#1d4ed8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:min(420px,100%);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 10px 30px rgba(31,41,55,.08);
    padding:32px 26px 24px;
  }
  h1{font-size:30px;margin:0 0 6px;letter-spacing:.02em}
  .sub{font-size:14px;color:var(--sub);margin:0 0 24px;line-height:1.6}
  form{display:flex;flex-direction:column;gap:12px}
  input{
    width:100%;
    height:48px;
    padding:0 14px;
    font-size:16px;
    color:var(--ink);
    background:#fffef9;
    border:1px solid var(--line);
    border-radius:12px;
    outline:none;
    font-family:inherit;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  button{
    height:48px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    font-size:16px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:background .18s ease,transform .18s ease;
  }
  button:hover{background:var(--accent-deep)}
  button:active{transform:scale(.985)}
  button:disabled{background:#9db4e0;cursor:default}
  .msg{min-height:20px;margin:14px 0 0;font-size:13px;color:#dc2626;line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <h1>背单词</h1>
  <p class="sub">输入口令，打开你的词库。</p>
  <form id="gate" autocomplete="off">
    <input id="pw" type="password" placeholder="口令" autocomplete="current-password" aria-label="口令">
    <button id="go" type="submit">打开</button>
  </form>
  <p id="msg" class="msg" role="alert"></p>
</main>

    return deriveKey(pw, b64ToBytes(SALT_B64))
      .then(function(key){
        return crypto.subtle.decrypt({ name:"AES-GCM", iv: iv }, key, data);
      })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }

  function enter(html){
    document.open();
    document.write(html);
    document.close();
  }

  function setMsg(t){
    var el = document.getElementById("msg");
    if(el) el.textContent = t;
  }

  function attempt(pw, silent){
    if(busy) return;
    busy = true;
    var btn = document.getElementById("go");
    if(btn) btn.disabled = true;
    if(!silent) setMsg("");
    decrypt(pw).then(function(html){
      try{ sessionStorage.setItem(STORE, pw); }catch(e){}
      enter(html);
    }).catch(function(){
      busy = false;
      if(btn) btn.disabled = false;
      if(!silent) setMsg("口令不对，再试一次。");
    });
  }

  document.getElementById("gate").addEventListener("submit", function(e){
    e.preventDefault();
    var pw = document.getElementById("pw").value;
    if(!pw){ setMsg("请输入口令。"); return; }
    attempt(pw, false);
  });

  try{
    var cached = sessionStorage.getItem(STORE);
    if(cached) attempt(cached, true);
  }catch(e){}
})();
</script>
</body>
</html>
